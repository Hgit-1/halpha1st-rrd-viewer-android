name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-31" "build-tools;28.0.3"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Java and JavaScript regression tests
        run: |
          mkdir -p build/ci-tests
          javac -source 8 -target 8 -encoding UTF-8 -d build/ci-tests \
            src/io/rerun/viewer/shell/RrdFrames.java \
            src/io/rerun/viewer/shell/RrdPreview.java \
            tests/io/rerun/viewer/shell/RrdPreviewTest.java \
            tests/io/rerun/viewer/shell/RrdFramesTest.java
          java -cp build/ci-tests io.rerun.viewer.shell.RrdFramesTest
          java -cp build/ci-tests io.rerun.viewer.shell.RrdPreviewTest
          node tests/mobile-test.js
          node tests/filter-test.js
          node tests/stream-test.js
          node tests/source-loader-test.js
          node tests/source-worker-test.js
          node tests/source-loader-direct-seek-test.js
          node tests/source-loader-jump-test.js
          node tests/source-loader-playback-test.js
          node tests/wasm-allocator-test.js
      - name: Restore signing key and build APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > rerun-debug.keystore
          chmod 600 rerun-debug.keystore
          trap 'rm -f rerun-debug.keystore' EXIT
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-31/android.jar"
          export SDK_FRAMEWORK="$ANDROID_JAR"
          export PATH="$ANDROID_HOME/build-tools/28.0.3:$PATH"
          export AAPT=aapt DX=dx
          sh build.sh
      - name: Verify version and signatures
        run: |
          "$ANDROID_HOME/build-tools/28.0.3/aapt" dump badging dist/RerunViewer.apk > build/badging.txt
          grep "versionCode='103' versionName='1.0'" build/badging.txt
          "$ANDROID_HOME/build-tools/28.0.3/apksigner" verify --verbose dist/RerunViewer.apk
          sha256sum dist/RerunViewer.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: RerunViewer-1.0-103
          path: |
            dist/RerunViewer.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
