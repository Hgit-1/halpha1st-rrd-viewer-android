name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-31" "build-tools;28.0.3"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Java and JavaScript regression tests
        working-directory: RerunViewer
        run: |
          node tests/mobile-test.js
          node tests/filter-test.js
          node tests/stream-test.js
          node tests/source-loader-test.js
          node tests/source-worker-test.js
          node tests/source-loader-direct-seek-test.js
          node tests/source-loader-jump-test.js
          node tests/source-loader-playback-test.js

      - name: Build signed APK
        working-directory: RerunViewer
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-31/android.jar
          SDK_FRAMEWORK: ${{ env.ANDROID_HOME }}/platforms/android-31/android.jar
          AAPT: ${{ env.ANDROID_HOME }}/build-tools/28.0.3/aapt
          DX: ${{ env.ANDROID_HOME }}/build-tools/28.0.3/dx
          ZIP: zip
        run: |
          # build.sh uses the local debug keystore only when it is present.
          # CI creates a disposable key, so no signing key is committed.
          keytool -genkeypair -keystore rerun-debug.keystore \
            -storepass android -keypass android -alias rerun \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Rerun Viewer CI, O=Hgit-1, C=US' >/dev/null 2>&1
          sh build.sh

      - name: Verify package metadata and signatures
        working-directory: RerunViewer
        run: |
          "$ANDROID_HOME/build-tools/28.0.3/aapt" dump badging dist/RerunViewer.apk | grep -E "versionCode='103'|versionName='1.0'"
          "$ANDROID_HOME/build-tools/28.0.3/apksigner" verify --verbose dist/RerunViewer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RerunViewer-1.0-103
          path: RerunViewer/dist/RerunViewer.apk
          if-no-files-found: error
