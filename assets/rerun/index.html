<!doctype html>
<!-- Rerun SDK-bundled web viewer. -->
<html>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <!-- Disable zooming: -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <head>
    <!-- Self-contained viewer: do not wait for external fonts or tracking scripts. -->
    <title>Rerun Viewer</title>
    <style>
      html {
        /* Remove touch delay: */
        touch-action: manipulation;
      }

      body {
        background: #0d1011;
      }

      /* Allow canvas to fill entire web page: */
      html,
      body {
        overflow: hidden;
        margin: 0 !important;
        padding: 0 !important;
        height: 100%;
        width: 100%;
      }

      /* Position canvas in center-top: */
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* Match the Rerun header bar. */
      .header {
        width: 100%;
        height: 44px;
        /* background: #111415; */
        /* Actual value from Rerun Viewer */
        background: #141414;
      }

      /* Create a container filling the remaining space. */
      .container {
        position: absolute;
        height: calc(100vh - 44px);
        width: 100vw;
      }

      /* Centered div inside the container. */
      .centered {
        margin-right: auto;
        margin-left: auto;
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      /* Rerun styling for normal text. */
      p {
        /*Gray-775*/
        color: #cad8de;
        letter-spacing: -0.15px;
        font-family: "Inter", sans-serif;
        font-weight: 500;
      }

      /* Rerun styling for strong text. Matches `TextStyle::Heading`. */
      .strong {
        /*Gray-775*/
        color: #ffffff;
        /* Match current rerun header value */
        font-size: 16px;
      }

      /* Rerun styling for subdued text.*/
      .subdued {
        /*Gray-550*/
        color: #7d8c92;
        /* Larger subdued size to match current rerun font */
        font-size: 12px;
        letter-spacing: -0.12px;
      }

      pre {
        /*Gray-550*/
        color: #7d8c92;
        font-size: 10px;
        letter-spacing: -0.12px;
      }

      a .button {
        display: inline-block;
        background: white;
        color: black;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
      }

      /* Transition to hidden */
      .hidden {
        opacity: 0;
        transition: opacity 0.2s ease-out;
        visibility: hidden;
      }

      /* Transition to visible */
      .visible {
        opacity: 100;
        transition: opacity 0.2s ease-in;
        visibility: visible;
      }
    </style>
  </head>

  <body>
    <div class="header"></div>
    <div class="container">
      <div class="centered hidden" id="center_text"></div>
    </div>
    <!-- The Wasm code will resize the canvas dynamically -->
    <canvas id="the_canvas_id" class="hidden" tabindex="0"></canvas>

    <!-- HTTP loopback hosting supports streaming WebAssembly compilation. -->

    <!-- this is the JS generated by the `wasm-bindgen` CLI tool -->
      <!-- v75-compatible asset set; the query is only for WebView cache busting. -->
    <script crossorigin="anonymous" src="mobile.js?asset_version=103"></script>
    <script crossorigin="anonymous" src="re_viewer.js?asset_version=103"></script>
    <script crossorigin="anonymous" src="rrd_filter.js?asset_version=103"></script>
    <script src="source_loader.js?asset_version=103"></script>
    <script>
      let viewerFailed = false;
      let wasmExports;
      function allocationMetrics() {
        // Call only allocation-free scalar exports; fatal reporting must not allocate
        // inside WASM after an OOM. Keep compatibility with older test handles.
        const value = name => wasmExports && typeof wasmExports[name] === 'function'
          ? wasmExports[name]() : -1;
        return 'wasm-linear-bytes=' + (wasmExports && wasmExports.memory ? wasmExports.memory.buffer.byteLength : -1)
          + ' wasm-live-bytes=' + value('mobile_live_allocated_bytes')
          + ' failed-alloc-bytes=' + value('mobile_failed_allocation_bytes')
          + ' failed-alloc-align=' + value('mobile_failed_allocation_alignment');
      }
      if (typeof window !== 'undefined') window._sourceMemoryPressure = () => ({live:0,linear:0,max:0});
      function reportFatal(error) {
        if (viewerFailed) return;
        const detail = (allocationMetrics() + ' '
          + String(error && error.stack ? error.stack : error)).slice(0, 1800);
        if (window._handle) {
          const panic = RerunMobile.panicDetail(window._handle);
          if (panic && window.RerunAndroid) window.RerunAndroid.stage('wasm-panic:' + panic.slice(0, 1800));
        }
        viewerFailed = true;
        if (window.RerunAndroid) window.RerunAndroid.stage('fatal:' + detail);
      }
      // Upstream async RRD decoder logs malformed messages and continues. That
      // would make part counters look successful even with dropped chunks.
      // Surface only decoder/store rejection as fatal; compatibility and GL
      // performance warnings remain warnings, not blanket-suppressed errors.
      const originalConsoleWarn = console.warn.bind(console);
      console.warn = function (...args) {
        originalConsoleWarn(...args);
        const message = args.map(String).join(' ');
        if (message.includes('Failed to decode message:')) reportFatal(message);
      };
      const originalConsoleError = console.error.bind(console);
      console.error = function (...args) {
        originalConsoleError(...args);
        const message = args.map(String).join(' ');
        if (message.includes('Failed to add incoming msg:')) reportFatal(message);
      };
      window.addEventListener('unhandledrejection', event => {
        const reason = event && event.reason;
        const detail = reason && reason.stack ? reason.stack : String(reason);
        if (window.RerunAndroid) window.RerunAndroid.stage('promise-rejection:' + detail.slice(0, 1200));
        reportFatal(detail);
      });
      window.addEventListener("error", function(event) {
        const detail = (event && event.error && event.error.stack)
          || ((event && event.message) + " @ " + (event && event.filename) + ":"
              + (event && event.lineno) + ":" + (event && event.colno));
        reportFatal(detail);
        var target = document.getElementById("center_text");
        if (target) {
          target.textContent = "JavaScript 启动错误: " + detail;
          target.classList.remove("hidden");
          target.classList.add("visible");
        }
      });
      function show_center_html(html) {
        center_text_elem = document.getElementById("center_text");
        center_text_elem.innerHTML = html;
        center_text_elem.classList.remove("hidden");
        center_text_elem.classList.add("visible");
      }
      function hide_center_html(html) {
        center_text_elem = document.getElementById("center_text");
        center_text_elem.innerHTML = html;
        center_text_elem.classList.remove("visible");
        center_text_elem.classList.add("hidden");
      }
      function show_canvas(html) {
        canvas_elem = document.getElementById("the_canvas_id");
        canvas_elem.classList.remove("hidden");
        canvas_elem.classList.add("visible");
      }
      function hide_canvas(html) {
        canvas_elem = document.getElementById("the_canvas_id");
        canvas_elem.classList.remove("visible");
        canvas_elem.classList.add("hidden");
      }

      // Android hosts this viewer inside a hardware-accelerated WebView. The native
      // shell provides the mobile compatibility layer, so do not show the desktop
      // browser warning or require a second tap before starting the viewer.
        window.setInterval(function () {
          if (!viewerFailed && window.RerunAndroid && window.RerunAndroid.heartbeat) {
            window.RerunAndroid.heartbeat();
          }
        }, 5000);
        load_wasm();

      var urlWebGl = new URL(window.location);
      urlWebGl.searchParams.set("renderer", "webgl");

      var urlWebGpu = new URL(window.location);
      urlWebGpu.searchParams.set("renderer", "webgpu");

      const forceWgpuBackendInfoParagraph = `
        <p>
            For graphics related issues, try forcing to render with WebGL<br>
            <a href="${urlWebGl}">${urlWebGl}</a><br>
            or with WebGPU<br>
            <a href="${urlWebGpu}">${urlWebGpu}</a>
        </p>`;

      function capWasmMemory(bytes, maxPages) {
        // Add a real maximum to the module's private memory before WebView
        // instantiates it. Use loops rather than spread on whole custom/data
        // sections: the module is tens of MiB and spread would overflow JS.
        const src = new Uint8Array(bytes), out = [];
        const readLeb = (at) => { let value=0, shift=0, p=at; for(;;){const b=src[p++];value|=(b&127)<<shift;if(!(b&128))return [value>>>0,p];shift+=7;} };
        const writeLeb = (value) => { const a=[]; do { let b=value&127; value>>>=7; if(value)b|=128; a.push(b); } while(value); return a; };
        const append = (from,to) => { for(let i=from;i<to;i++) out.push(src[i]); };
        append(0,8); let p=8;
        while(p<src.length){ const id=src[p++], lr=readLeb(p), len=lr[0]; p=lr[1]; const end=p+len;
          if(id!==5){ out.push(id,...writeLeb(len)); append(p,end); p=end; continue; }
          const count=readLeb(p), flags=readLeb(count[1]), min=readLeb(flags[1]);
          if(count[0]!==1 || (flags[0]&1) || maxPages<min[0]){out.push(id,...writeLeb(len));append(p,end);p=end;continue;}
          const payload=[...writeLeb(1),...writeLeb(1),...writeLeb(min[0]),...writeLeb(maxPages)];
          out.push(id,...writeLeb(payload.length),...payload); p=end;
        }
        return new Uint8Array(out).buffer;
      }

      function load_wasm() {
        // We'll defer our execution until the wasm is ready to go.
        // Here we tell bindgen the path to the wasm file so it can start
        // initialization and return to us a promise when it's done.

        console.debug("loading wasm…");
        if (window.RerunAndroid && window.RerunAndroid.stage) {
          window.RerunAndroid.stage("wasm-fetch");
        }

        document.getElementById("center_text").innerHTML = `
                <p class="strong">
                    Loading Application Bundle…
                </p>
                <p class="subdued" id="status">
                </p>`;

        const status_element = document.getElementById("status");
        function progress({ loaded, total_bytes }) {
          if (total_bytes != null && total_bytes > 0) {
            status_element.innerHTML =
              Math.round(Math.min((loaded / total_bytes) * 100, 100)) + "%";
          } else {
            status_element.innerHTML =
              (loaded / (1024 * 1024)).toFixed(1) + "MiB";
          }
        }

        var timeoutId = setTimeout(function () {
          document.getElementById("center_text").classList.remove("hidden");
          document.getElementById("center_text").classList.add("visible");
        }, 1500);

        function debug_stage(value) {
          status_element.innerHTML = value;
          status_element.parentElement.classList.remove("hidden");
          status_element.parentElement.classList.add("visible");
          if (window.RerunAndroid && window.RerunAndroid.stage) window.RerunAndroid.stage(value);
        }

        async function wasm_with_progress() {
          let finished = false;
          let compileTimer;
          const controller = new AbortController();
          const fail = (error) => {
            if (finished) return;
            finished = true;
            controller.abort();
            clearTimeout(compileTimer);
            clearTimeout(fetchTimeout);
            clearTimeout(timeoutId);
            on_wasm_error(error);
          };
          const fetchTimeout = setTimeout(() => {
            fail(new Error("Local WASM request timed out after 90 seconds"));
          }, 90000);
          try {
            debug_stage("fetch-start");
            const response = await fetch("./re_viewer_bg.wasm?asset_version=103", { cache: "default", signal: controller.signal });
            debug_stage("fetch-response");
            if (!response.ok) throw new Error(`WASM HTTP ${response.status}`);
            const contentLength = Number(response.headers.get("content-length")) || 0;
            if (contentLength > 0) {
              status_element.innerHTML = `${(contentLength / (1024 * 1024)).toFixed(1)} MiB`;
            }
            debug_stage("wasm-memory-cap");
            const wasmBytes = await response.arrayBuffer();
            const query = new URLSearchParams(window.location.search);
            const maxPages = Number(query.get("wasm_max_pages")) || 2048;
            const cappedBytes = capWasmMemory(wasmBytes, maxPages);
            debug_stage("wasm-compile");
            const compileTimeout = new Promise((_, reject) => { compileTimer = setTimeout(
              () => reject(new Error("wasm_bindgen timed out after 120 seconds")), 120000); });
            let wasmResult;
            try {
              wasmResult = await Promise.race([wasm_bindgen({module_or_path: cappedBytes}), compileTimeout]);
              wasmExports = wasmResult;
              clearTimeout(compileTimer);
              debug_stage("wasm-compile-done");
            } catch (compileError) {
              debug_stage("wasm-compile-error");
              fail(compileError);
              return;
            }
            if (finished) return;
            finished = true;
            clearTimeout(fetchTimeout);
            clearTimeout(timeoutId);
            await on_wasm_loaded();
          } catch (error) {
            fail(error);
          }
        }

        wasm_with_progress();
      }

      async function on_wasm_loaded() {
        console.debug("Wasm loaded. Starting app…");
        if (window.RerunAndroid && window.RerunAndroid.stage) window.RerunAndroid.stage("wasm-ready");
        
        window.set_email = (value) => wasm_bindgen.set_email(value);

        const query = new URLSearchParams(window.location.search);

            const options = {
          url: query.getAll("url"),
          manifest_url: query.get("manifest_url"),
          render_backend: query.get("renderer") || "webgl",
          video_decoder: query.get("video_decoder"),
          hide_welcome_screen: query.has("hide_welcome_screen"),
          memory_limit_bytes: query.get("memory_limit_bytes") ? Number(query.get("memory_limit_bytes")) : undefined,
          enable_history: false,
          notebook: get_query_bool(query, "notebook", false),
          persist: false,
        };

        if (window.RerunAndroid && window.RerunAndroid.stage) {
          window.RerunAndroid.stage("webgl-start");
        }
        
        await new Promise((resolve) => setTimeout(resolve, 0));
        
        let handle;
        try {
          handle = new wasm_bindgen.WebHandle(options);
        } catch (error) {
          on_wasm_error(error);
          return;
        }

        function check_for_panic() {
          if (handle.has_panicked()) {
            const detail = RerunMobile.panicDetail(handle) || "unknown wasm panic";
            if (window.RerunAndroid) window.RerunAndroid.stage('wasm-panic:' + detail.slice(0, 1800));
            if (!viewerFailed) {
              reportFatal(detail);
              console.error("Rerun has crashed", detail);
              document.getElementById("the_canvas_id").remove();
              show_center_html('<p class="strong">Rerun has crashed.</p><pre id="panic_detail"></pre>');
              document.getElementById('panic_detail').textContent = detail;
            }
            return;
          }
          let delay_ms = 1000;
          setTimeout(check_for_panic, delay_ms);
        }

        check_for_panic();

        try {
          handle
            .start(document.getElementById("the_canvas_id"))
            .then(() => { on_app_started(handle); })
            .catch((error) => { on_wasm_error(error); });
        } catch (error) {
          on_wasm_error(error);
        }
      }

      function get_query_bool(
        /** @type {URLSearchParams} */ query,
        /** @type {string} */ key,
        /** @type {boolean} */ fallback,
      ) {
        const values = query.getAll(key);
        if (values.length === 0) return fallback;
        if (values.length !== 1) {
          console.warn(
            `found ${values.length} values for "${key}" query. Expected one or none. Defaulting to "${fallback}".`,
          );
          return fallback;
        }

        // prettier-ignore
        switch (values[0]) {
          case "0": /* fallthrough */
          case "false": return false;

          case "": /* fallthrough */
          case "1": /* fallthrough */
          case "true": return true;

          default:
            console.warn(`unexpected value for "${key}" query. Expected one of: 0, 1, false, true, or no value. Defaulting to "${fallback}".`);
            return fallback;
        }
      }

      async function readBoundedResponse(response) {
        if (!response.body || !response.body.getReader) throw new Error("streaming response unavailable");
        const reader = response.body.getReader();
        const chunks = []; let total = 0;
        try {
          while (true) {
            const next = await reader.read();
            if (next.done) break;
            const chunk = next.value;
            total += chunk.length;
            if (total > 8 * 1024 * 1024) throw new Error("filtered segment exceeds memory budget");
            chunks.push(chunk);
          }
        } catch (error) {
          await reader.cancel().catch(() => {});
          throw error;
        } finally {
          reader.releaseLock();
        }
        const bytes = new Uint8Array(total); let offset = 0;
        for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; }
        return bytes;
      }

      window.startFilteredRecording = async function(handle, id, count) {
        if (window._filteredBusy) throw new Error("A recording import is already active");
        const token = {}; window._sourceImportToken = token;
        window._filteredBusy = true;
        try {
          await RerunSource.load(handle, id, count, {
            stage: message => { if(window.RerunAndroid) window.RerunAndroid.stage(message); },
            failed: () => viewerFailed,
            submitted: () => { if(window._sourceImportToken === token) window._filteredBusy = false; },
          });
        } catch(error) {
          if(!error.sourceCanceled) reportFatal(error && error.stack ? error.stack : String(error));
        } finally { if(window._sourceImportToken === token) window._filteredBusy = false; }
      }

      function on_app_started(handle) {
        // Call `handle.destroy()` to stop. Uncomment to quick result:
        // setTimeout(() => { handle.destroy(); handle.free()) }, 2000)

        console.debug("App started.");
        if (window.RerunAndroid && window.RerunAndroid.stage) {
          window.RerunAndroid.stage("app-started");
        }
        hide_center_html();
        show_canvas();

        if (window.location !== window.parent.location) {
          window.parent.postMessage("READY", "*");
        }

        window._handle = handle;
        window._filteredBusy = false;
        const metricsTimer = setInterval(() => {
          if (viewerFailed) { clearInterval(metricsTimer); return; }
          const canvas = document.getElementById('the_canvas_id');
          const metricText = allocationMetrics();
          window._sourceMemoryPressure = () => ({
            live: wasmExports && typeof wasmExports.mobile_live_allocated_bytes === 'function' ? wasmExports.mobile_live_allocated_bytes() : 0,
            linear: wasmExports && wasmExports.memory ? wasmExports.memory.buffer.byteLength : 0,
            max: Number(new URLSearchParams(window.location.search).get('memory_limit_bytes')) || 0,
          });
          if (window.RerunAndroid) window.RerunAndroid.stage('metrics:' + metricText
            + ' css=' + canvas.clientWidth + 'x' + canvas.clientHeight
            + ' dpr=' + window.devicePixelRatio + ' canvas=' + canvas.width + 'x' + canvas.height + ' null-detaches-skipped=' + RerunMobile.skipped());
        }, 10000);
        if (window.RerunAndroid && window.RerunAndroid.ready) {
          window.RerunAndroid.ready();
        }
      }

      function on_wasm_error(error) {
        reportFatal(error);
        console.error("Failed to start: " + error);

        hide_canvas();
        show_center_html(`
          <p>
              An error occurred during loading:
          </p>
          <p style="font-family:Courier New;overflow-wrap:anywhere">
              ${String(error).replace(/[&<>\"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c])}
          </p>
          <p>
              Reload the page to try again.<br>
              Please consider filing a <a href=https://github.com/rerun-io/rerun/issues/new/>bug report<a>. Thank you!
          </p>
          ${forceWgpuBackendInfoParagraph}
        `);
      }
    </script>
  </body>
</html>
